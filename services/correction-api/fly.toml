app = "corrige-plus-opencv-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  ALLOWED_ORIGINS = "https://corrige-plus-deividi-web.onrender.com"
  MAX_IMAGE_SIZE_MB = "15"
  TEMP_STORAGE_PATH = "/tmp/corrige-plus"
  FILE_RETENTION_HOURS = "24"
  RESULT_RETENTION_HOURS = "24"
  CORRECTION_DEBUG_ARTIFACTS = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
